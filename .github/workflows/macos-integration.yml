name: macOS Apple Silicon preview

on:
  push:
    branches: [dot/macos-arm64, codex/macos-0.5.1, codex/macos-0.5.1-parity, codex/macos-0.6.0-release]
  pull_request:
    paths:
      - 'Desktop/**'
      - 'patches/**'
      - 'scripts/apply-step-code-desktop-patch.mjs'
      - 'scripts/ci-macos*'
      - 'scripts/ci-canvas-prebuild*'
      - 'scripts/ci-acceptance.mjs'
      - 'scripts/ci-windows*'
      - '.github/workflows/macos-*.yml'
      - '.github/actions/setup-macos/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each hosted job gets its own VM; supersede only runs for the same ref.
  group: macos-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Build and verify one ARM64 candidate
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DESKTOP_MACOS_RELEASE_VERSION: 0.6.0
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-macos
      - name: Upstream shared runtime integration tests
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/step-plan-extension.test.ts test/plan-mode-extension.test.ts test/plan-mode-utils.test.ts test/plan-review-dialog.test.ts test/step-then-run-command-parity.test.ts test/step-permissions.test.ts test/step-extension.test.ts test/suite/agent-session-prompt.test.ts test/shell-process-tree.test.ts test/shell-process-tree-darwin.test.ts test/step-subagent-events.test.ts test/desktop-background-replies.test.ts test/subagent-exit-drain.test.ts test/step-usage-lifecycle.test.ts test/step-cron.test.ts test/auto-clm-runtime.test.ts test/context-projection.test.ts test/suite/agent-session-auto-clm.test.ts test/suite/agent-session-clm-completion.test.ts test/agent-session-stats.test.ts test/session-import.test.ts test/session-manager/build-context.test.ts test/compaction-serialization.test.ts test/workflow-runtime.test.ts test/workflow-extension.test.ts test/workflow-agent-runner.test.ts test/workflow-vm.test.ts test/workflow-registration.test.ts
      - name: Upstream v0.1.6 boundary regressions
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/subagent-lane-notifications.test.ts test/subagent-background-tui.test.ts test/step-search-web.test.ts test/suite/regressions/plan-mode-prompt-cache-prefix.test.ts test/suite/regressions/6647-compaction-retries-transient-stream-drop.test.ts test/suite/regressions/subagent-lane-progress-backlog.test.ts
      - name: Upstream v0.1.7 safety and context regressions
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/suite/plan-approval-gate.test.ts test/suite/plan-barrier.test.ts test/suite/plan-storage.test.ts test/plan-handoff.test.ts test/extension-plan-review-surface.test.ts test/step-plan-mode-prompt.test.ts test/compaction-trigger-policy.test.ts test/suite/agent-session-compaction-trigger.test.ts test/suite/incomplete-turn-recovery.test.ts test/command-outcome.test.ts test/compaction-summary-reasoning.test.ts test/compaction.test.ts test/branch-summary-extensions.test.ts test/suite/regressions/find-removed-host-cwd.test.ts
      - name: Typecheck and protocol tests
        working-directory: Desktop
        run: |
          corepack pnpm typecheck
          mkdir -p test-results
          corepack pnpm exec tsx --test --test-concurrency=1 --test-reporter=spec --test-reporter=tap --test-reporter-destination=stdout --test-reporter-destination=test-results/protocol.tap tests/*.test.ts
      - name: CI runner and motion helper regressions
        working-directory: Desktop
        run: |
          node --test ../scripts/ci-windows.test.mjs ../scripts/ci-macos.test.mjs ../scripts/ci-macos-policy.test.mjs ../scripts/ci-canvas-prebuild.test.mjs
          node --test scripts/motion-helpers.test.mjs
      - name: Package unsigned preview and verify resources
        working-directory: Desktop
        run: |
          node scripts/package-macos.mjs
          node scripts/verify-macos-package.mjs
      - name: Archive candidate with executable permissions
        working-directory: Desktop
        run: |
          node scripts/prepare-macos-release.mjs
          cp release/v*/Desktop.for.Step.Code.*.arm64.zip release/Desktop.for.Step.Code.macos-arm64.preview.zip
          shasum -a 256 release/Desktop.for.Step.Code.macos-arm64.preview.zip > release/SHA256SUMS.txt
          git rev-parse HEAD > release/COMMIT.txt
          cp runtime/manifest.json release/runtime-manifest.json
      - name: Bind candidate to this commit
        id: candidate
        run: node scripts/ci-macos-policy.mjs candidate Desktop/release
      - name: Upload unvalidated candidate for this run
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-unvalidated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Desktop/release/*.zip
            Desktop/release/SHA256SUMS.txt
            Desktop/release/COMMIT.txt
            Desktop/release/runtime-manifest.json
            Desktop/release/v*/mac-update.json
            Desktop/release/v*/*.zip
            Desktop/release/v*/SHA256SUMS-macos-arm64.txt
            Desktop/release/v*/COMMIT-macos-arm64.txt
            Desktop/release/v*/runtime-manifest-macos-arm64.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-fixture-diagnostics-prepare-${{ github.run_attempt }}
          path: Desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  interface:
    needs: prepare
    uses: ./.github/workflows/macos-acceptance.yml
    with:
      group: interface
      commit: ${{ needs.prepare.outputs.commit }}
      sha256: ${{ needs.prepare.outputs.sha256 }}
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}

  sessions:
    needs: prepare
    uses: ./.github/workflows/macos-acceptance.yml
    with:
      group: sessions
      commit: ${{ needs.prepare.outputs.commit }}
      sha256: ${{ needs.prepare.outputs.sha256 }}
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}

  runtime:
    needs: prepare
    uses: ./.github/workflows/macos-acceptance.yml
    with:
      group: runtime
      commit: ${{ needs.prepare.outputs.commit }}
      sha256: ${{ needs.prepare.outputs.sha256 }}
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}

  macos:
    # Preserve the existing required check name.
    name: ARM64 build, tests and packaged acceptance
    if: always()
    needs: [prepare, interface, sessions, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_MACOS_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Require all job outcomes and exact group receipts
        run: node scripts/ci-macos-policy.mjs outcomes
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.interface.outputs.receipt-id }},${{ needs.sessions.outputs.receipt-id }},${{ needs.runtime.outputs.receipt-id }}
          merge-multiple: true
          path: receipts
      - name: Verify complete source and package inventories
        run: node scripts/ci-macos-policy.mjs conclude receipts
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Recheck the exact tested archive before promotion
        env:
          CI_MACOS_COMMIT: ${{ needs.prepare.outputs.commit }}
          CI_MACOS_CANDIDATE_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: node scripts/ci-macos-policy.mjs candidate candidate
      - name: Upload fully tested preview candidate (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error
