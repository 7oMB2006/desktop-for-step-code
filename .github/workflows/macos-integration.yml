name: macOS Apple Silicon preview

on:
  push:
    branches: [dot/macos-arm64, codex/macos-0.5.1, codex/macos-0.5.1-parity, codex/macos-0.6.0-release]
  pull_request:
    paths:
      - 'Desktop/**'
      - 'patches/**'
      - 'scripts/apply-step-code-desktop-patch.mjs'
      - 'scripts/ci-macos*'
      - 'scripts/ci-acceptance.mjs'
      - 'scripts/ci-windows*'
      - '.github/workflows/macos-integration.yml'
      - '.github/workflows/macos-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-interface:
    name: macOS interface
    uses: ./.github/workflows/macos-acceptance.yml
    with:
      group: interface
  macos-sessions:
    name: macOS sessions
    uses: ./.github/workflows/macos-acceptance.yml
    with:
      group: sessions
  macos-runtime:
    name: macOS runtime
    uses: ./.github/workflows/macos-acceptance.yml
    with:
      group: runtime
