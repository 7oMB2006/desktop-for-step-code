name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Test CI policy and acceptance inventory
        run: node --test scripts/ci-policy.test.mjs scripts/ci-windows.test.mjs
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-policy.mjs classify

  documentation:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  windows-interface:
    name: Windows interface
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/windows-integration.yml
    with:
      group: interface

  windows-sessions:
    name: Windows sessions
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/windows-integration.yml
    with:
      group: sessions

  windows-runtime:
    name: Windows runtime
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/windows-integration.yml
    with:
      group: runtime

  result:
    name: CI result
    needs: [changes, documentation, windows-interface, windows-sessions, windows-runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Require the selected checks to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-policy.mjs conclude
