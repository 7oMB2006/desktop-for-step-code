name: Windows integration group

on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
    outputs:
      group:
        description: Acceptance group that actually completed
        value: ${{ jobs.acceptance.outputs.group }}
      complete:
        description: True only after every assigned check passed
        value: ${{ jobs.acceptance.outputs.complete }}
      shared-complete:
        description: Runtime shared checks completed, or explicitly not applicable
        value: ${{ jobs.acceptance.outputs.shared-complete }}

permissions:
  contents: read

jobs:
  acceptance:
    name: Build and acceptance
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      group: ${{ steps.acceptance.outputs.group }}
      complete: ${{ steps.acceptance.outputs.complete }}
      shared-complete: ${{ steps.shared.outputs.complete }}
    steps:
      - name: Check out Desktop
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          # Includes the Windows TCP-connect crash fix (nodejs/node#63620).
          node-version: 24.16.0

      - name: Validate acceptance group
        id: validate
        env:
          CI_WINDOWS_GROUP: ${{ inputs.group }}
        run: |
          node --test scripts/ci-windows.test.mjs scripts/windows-ci-summary.test.mjs scripts/ci-protocol.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows acceptance runner tests failed' }
          node scripts/ci-windows.mjs --list
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Windows acceptance group' }

      - name: Fetch pinned Step Code
        id: upstream_fetch
        shell: pwsh
        run: |
          $upstream = Join-Path $env:GITHUB_WORKSPACE 'Step-Code'
          git init $upstream
          if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize Step Code checkout' }
          git -C $upstream config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to configure Step Code line endings' }
          git -C $upstream remote add origin https://github.com/stepfun-ai/Step-Code.git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to configure Step Code remote' }
          git -C $upstream fetch --depth 1 --no-tags origin 29eb460780489801ce8afc8bffc1a2efae7cbded
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch pinned Step Code revision' }
          git -C $upstream checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check out pinned Step Code revision' }
          if ((git -C $upstream rev-parse HEAD).Trim() -ne '29eb460780489801ce8afc8bffc1a2efae7cbded') {
            throw 'Unexpected Step Code revision'
          }

      - name: Apply Desktop integration patch
        id: upstream_patch
        shell: pwsh
        run: |
          $upstream = Join-Path $env:GITHUB_WORKSPACE 'Step-Code'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches/v017/step-code-desktop.patch'
          $applyScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/apply-step-code-desktop-patch.mjs'
          node $applyScript $upstream $patch
          if ($LASTEXITCODE -ne 0) { throw 'Unable to apply the pinned Step Code integration changes' }
          git -C $upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Step Code integration changes contain whitespace errors' }

      - name: Prepare verified official canvas prebuild
        id: native_prebuild
        shell: pwsh
        run: |
          node scripts/ci-canvas-prebuild.mjs "$env:RUNNER_TEMP/dfsc-canvas-prebuilds"
          if ($LASTEXITCODE -ne 0) { throw 'Canvas prebuild preparation failed' }

      - name: Install and build Step Code
        id: upstream_build
        working-directory: Step-Code
        env:
          npm_config_canvas_local_prebuilds: ${{ runner.temp }}/dfsc-canvas-prebuilds
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Step Code install failed' }
          corepack pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Step Code build failed' }

      - name: Install Desktop dependencies
        id: desktop_install
        working-directory: Desktop
        env:
          electron_config_cache: ${{ runner.temp }}/dfsc-electron-cache
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Desktop install failed' }
          node ../scripts/ci-electron-prebuild.mjs "$env:electron_config_cache"
          if ($LASTEXITCODE -ne 0) { throw 'Electron prebuild preparation failed' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron install failed' }

      - name: Upstream Plan integration tests
        id: upstream_plan
        if: inputs.group == 'runtime'
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/step-plan-extension.test.ts test/plan-mode-extension.test.ts test/plan-mode-utils.test.ts test/plan-review-dialog.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Upstream Plan integration tests failed' }

      - name: Install startup preview browser
        id: preview_browser
        if: inputs.group == 'interface'
        timeout-minutes: 5
        working-directory: Desktop
        run: |
          corepack pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Startup preview browser install failed' }

      - name: Upstream Windows shell and Ultracode tests
        id: upstream_shell
        if: inputs.group == 'runtime'
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/shell-discovery.test.ts test/resolve-config-value.test.ts test/workflow-ultraloop-opt-in.test.ts test/suite/ultracode-discovery.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Upstream Windows shell and Ultracode tests failed' }

      - name: Upstream command and usage compatibility tests
        id: upstream_compatibility
        if: inputs.group == 'runtime'
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/step-then-run-command-parity.test.ts test/step-permissions.test.ts test/step-extension.test.ts test/suite/agent-session-prompt.test.ts test/shell-process-tree.test.ts test/step-subagent-events.test.ts test/desktop-background-replies.test.ts test/subagent-exit-drain.test.ts test/step-usage-lifecycle.test.ts test/step-cron.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Upstream command and usage compatibility tests failed' }

      - name: Upstream automatic CLM tests
        id: upstream_clm
        if: inputs.group == 'runtime'
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/auto-clm-runtime.test.ts test/context-projection.test.ts test/suite/agent-session-auto-clm.test.ts test/suite/agent-session-clm-completion.test.ts test/agent-session-stats.test.ts test/session-import.test.ts test/session-manager/build-context.test.ts test/compaction-serialization.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Upstream automatic CLM tests failed' }

      - name: Native plugin host launch regressions
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/desktop-plugin-host.test.ts src/step/mcp.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native plugin host launch regressions failed' }

      - name: Upstream Workflow stability tests
        id: upstream_workflow
        if: inputs.group == 'runtime'
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/workflow-runtime.test.ts test/workflow-extension.test.ts test/workflow-agent-runner.test.ts test/workflow-vm.test.ts test/workflow-registration.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Upstream Workflow stability tests failed' }

      - name: Upstream v0.1.6 boundary regressions
        id: upstream_v016
        if: inputs.group == 'runtime'
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/subagent-lane-notifications.test.ts test/subagent-background-tui.test.ts test/step-search-web.test.ts test/suite/regressions/plan-mode-prompt-cache-prefix.test.ts test/suite/regressions/6647-compaction-retries-transient-stream-drop.test.ts test/suite/regressions/subagent-lane-progress-backlog.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Upstream v0.1.6 boundary regressions failed' }

      - name: Upstream v0.1.7 safety and context regressions
        id: upstream_v017
        if: inputs.group == 'runtime'
        working-directory: Step-Code/packages/coding-agent
        run: |
          corepack pnpm exec vitest run test/suite/plan-approval-gate.test.ts test/suite/plan-barrier.test.ts test/suite/plan-storage.test.ts test/plan-handoff.test.ts test/extension-plan-review-surface.test.ts test/step-plan-mode-prompt.test.ts test/compaction-trigger-policy.test.ts test/suite/agent-session-compaction-trigger.test.ts test/suite/incomplete-turn-recovery.test.ts test/command-outcome.test.ts test/compaction-summary-reasoning.test.ts test/compaction.test.ts test/branch-summary-extensions.test.ts test/suite/regressions/find-removed-host-cwd.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Upstream v0.1.7 safety and context regressions failed' }

      - name: Runtime staging
        id: runtime_stage
        working-directory: Desktop
        run: |
          corepack pnpm stage:runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime staging failed' }

      - name: Typecheck
        id: typecheck
        if: inputs.group == 'runtime'
        working-directory: Desktop
        run: |
          corepack pnpm typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }

      - name: Protocol tests
        id: protocol
        if: inputs.group == 'runtime'
        working-directory: Desktop
        run: |
          node ../scripts/ci-protocol.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Protocol tests failed' }

      - name: Seal shared check outcomes
        id: shared
        env:
          CI_WINDOWS_GROUP: ${{ inputs.group }}
          CI_SHARED_STEPS: >-
            {
              "upstream_plan": "${{ steps.upstream_plan.outcome }}",
              "upstream_shell": "${{ steps.upstream_shell.outcome }}",
              "upstream_compatibility": "${{ steps.upstream_compatibility.outcome }}",
              "upstream_clm": "${{ steps.upstream_clm.outcome }}",
              "upstream_workflow": "${{ steps.upstream_workflow.outcome }}",
              "upstream_v016": "${{ steps.upstream_v016.outcome }}",
              "upstream_v017": "${{ steps.upstream_v017.outcome }}",
              "typecheck": "${{ steps.typecheck.outcome }}",
              "protocol": "${{ steps.protocol.outcome }}"
            }
        run: node scripts/ci-policy.mjs shared-receipt

      - name: Desktop build
        id: desktop_build
        working-directory: Desktop
        run: |
          corepack pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }

      - name: Browser motion regressions
        id: motion_browser
        if: inputs.group == 'interface'
        working-directory: Desktop
        run: |
          node --test scripts/motion-helpers.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser motion regressions failed' }

      - name: Serial Electron acceptance
        id: acceptance
        env:
          CI_WINDOWS_GROUP: ${{ inputs.group }}
        run: node scripts/ci-windows.mjs

      - name: Cron manager browser regressions
        id: cron_browser
        if: inputs.group == 'interface'
        working-directory: Desktop
        run: |
          node --test scripts/cron-manager.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Cron manager browser regressions failed' }

      - name: Summarize Windows diagnostics
        if: always() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success'
        env:
          CI_WINDOWS_GROUP: ${{ inputs.group }}
          CI_WINDOWS_STEPS: >-
            {
              "validate": "${{ steps.validate.outcome }}",
              "upstream_fetch": "${{ steps.upstream_fetch.outcome }}",
              "upstream_patch": "${{ steps.upstream_patch.outcome }}",
              "native_prebuild": "${{ steps.native_prebuild.outcome }}",
              "upstream_build": "${{ steps.upstream_build.outcome }}",
              "desktop_install": "${{ steps.desktop_install.outcome }}",
              "upstream_plan": "${{ steps.upstream_plan.outcome }}",
              "preview_browser": "${{ steps.preview_browser.outcome }}",
              "upstream_shell": "${{ steps.upstream_shell.outcome }}",
              "upstream_compatibility": "${{ steps.upstream_compatibility.outcome }}",
              "upstream_clm": "${{ steps.upstream_clm.outcome }}",
              "upstream_workflow": "${{ steps.upstream_workflow.outcome }}",
              "upstream_v016": "${{ steps.upstream_v016.outcome }}",
              "upstream_v017": "${{ steps.upstream_v017.outcome }}",
              "runtime_stage": "${{ steps.runtime_stage.outcome }}",
              "typecheck": "${{ steps.typecheck.outcome }}",
              "protocol": "${{ steps.protocol.outcome }}",
              "shared": "${{ steps.shared.outcome }}",
              "desktop_build": "${{ steps.desktop_build.outcome }}",
              "motion_browser": "${{ steps.motion_browser.outcome }}",
              "acceptance": "${{ steps.acceptance.outcome }}",
              "cron_browser": "${{ steps.cron_browser.outcome }}"
            }
        run: node scripts/windows-ci-summary.mjs

      - name: Upload acceptance timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-timings-${{ inputs.group }}-${{ github.run_attempt }}
          path: |
            Desktop/test-results/ci-${{ inputs.group }}.json
            Desktop/test-results/ci-windows-${{ inputs.group }}-summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Electron failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-failure-screenshots-${{ inputs.group }}-${{ github.run_attempt }}
          path: Desktop/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload protocol test diagnostics
        if: always() && inputs.group == 'runtime'
        uses: actions/upload-artifact@v4
        with:
          name: protocol-tests-${{ inputs.group }}-${{ github.run_attempt }}
          path: Desktop/test-results/protocol/
          if-no-files-found: ignore
          retention-days: 7
