<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Step Code Startup</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { display: grid; place-items: center; }
    img { width: 88px; height: 88px; animation: arrive 650ms cubic-bezier(.22,1,.36,1) both; }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px) scale(.88); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  </style>
</head>
<body><img src="./StepCode.svg" alt="Desktop for Step Code"/></body>
</html>
