<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 720 720"
     width="720" height="720"
     fill="none">
  <title>Step Code</title>
  <defs>
    <!-- Continuous diagonal gradient: upper-right purple → lower-left yellow -->
    <linearGradient id="stepGradient"
                    x1="720" y1="0"
                    x2="0" y2="720"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9E72FB"/>
      <stop offset="34%" stop-color="#D58FEF"/>
      <stop offset="68%" stop-color="#FDB3A2"/>
      <stop offset="100%" stop-color="#FFDC62"/>
    </linearGradient>
  </defs>

  <!-- STEP core: five square blocks -->
  <g fill="url(#stepGradient)">
    <rect x="260" y="40"  width="190" height="190"/>
    <rect x="490" y="40"  width="190" height="190"/>
    <rect x="260" y="270" width="190" height="190"/>
    <rect x="30"  y="500" width="190" height="190"/>
    <rect x="260" y="500" width="190" height="190"/>
  </g>
</svg>
